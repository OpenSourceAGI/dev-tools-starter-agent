# server-shell-setup is plain bash with no package.json, so it is outside the
# turbo test matrix. This job runs its Vitest suites on a stock Ubuntu runner:
# first the dry-run tests, then a real `--components all` install followed by
# checks from inside bash, fish and nushell that everything landed.

name: server-shell-setup

on:
  pull_request:
    paths:
      - "packages/server-shell-setup/**"
      - ".github/workflows/server-shell-setup.yml"
  push:
    branches: [master]
    paths:
      - "packages/server-shell-setup/**"
      - ".github/workflows/server-shell-setup.yml"
  workflow_dispatch:

jobs:
  install-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/server-shell-setup
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests (dry run, no system changes)
        run: npx --yes vitest@3 run test/install-shell.test.js

      - name: End-to-end install and verify every shell
        env:
          SERVER_SHELL_SETUP_E2E: "1"
        run: npx --yes vitest@3 run test/install-shell.e2e.test.js
