name: Tests

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per package: each runs that package's own Vitest config and uploads
  # its own coverage/lcov.info under a Codecov flag matching the directory name.
  coverage:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: about-system-info
          - package: api2ai-mcp-generator
          - package: cloudflare-to-claude-fix
          - package: code-tree-graph
          - package: create-cloud-db
          - package: create-starter-app
          - package: export-svg-icons-typescript
          - package: git0-repo-downloader
          - package: legal-terms-privacy-policy
          - package: manage-storage
          - package: native-app-wrapper
          - package: open-when-ready
          - package: react-app-store-buttons
          - package: setup-git-repo
          - package: template-git-repo
          - package: verify-phone-sms
          - package: web2mobile-wrapper
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        # Postinstall hooks (drizzle-kit push, fumadocs-mdx, tauri) need runtime
        # env vars that CI does not have, and none of them affect the tests.
        run: bun install --ignore-scripts

      - name: Run coverage for ${{ matrix.package }}
        continue-on-error: ${{ matrix.allow-failure == true }}
        run: bunx turbo run coverage --filter=./packages/${{ matrix.package }}

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./packages/${{ matrix.package }}/coverage/lcov.info
          flags: ${{ matrix.package }}
          name: ${{ matrix.package }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.package }}
          path: packages/${{ matrix.package }}/coverage/
          retention-days: 7
          if-no-files-found: ignore
