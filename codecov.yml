# Codecov config for the packages wired up in .github/workflows/tests.yml.
#
# Only a few of the ~16 packages have suites today, so coverage numbers here
# describe those packages, not the monorepo. The statuses are informational for
# that reason — they annotate a pull request without ever blocking it. Test
# Analytics (the failed-test comment and the flake dashboard) is the part meant
# to be acted on.

codecov:
  # The publish workflow runs on master only, so a pull request has no CI to
  # wait on before Codecov reports.
  require_ci_to_pass: false

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        informational: true

# One flag per package, so a package that skips a run (its paths were untouched)
# keeps its last known coverage instead of reading as a drop.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: about-system-info
      paths:
        - packages/about-system-info/
    - name: git0-repo-downloader
      paths:
        - packages/git0-repo-downloader/
    - name: legal-terms-privacy-policy
      paths:
        - packages/legal-terms-privacy-policy/
    - name: manage-storage
      paths:
        - packages/manage-storage/
    - name: setup-git-repo
      paths:
        - packages/setup-git-repo/
    - name: template-git-repo
      paths:
        - packages/template-git-repo/
    - name: web2mobile-wrapper
      paths:
        - packages/web2mobile-wrapper/
    - name: verify-phone-sms
      paths:
        - packages/verify-phone-sms/

comment:
  layout: "header, diff, flags, files"
  # Don't post a comment on pull requests that changed nothing Codecov measures.
  require_changes: true

ignore:
  - "**/test/**"
  - "**/tests/**"
  - "**/examples/**"
  - "**/docs/**"
  - "**/dist/**"
  - "starter-templates/**"
